# O site fica em site/ e o CSV em dados/ (fonte da verdade).
# A cada deploy, o CSV é copiado para dentro do site.
[build]
  publish = "site"
  command = "cp dados/clima_vassouras.csv site/clima_vassouras.csv"

# O CSV muda todo dia: o navegador sempre revalida.
[[headers]]
  for = "/clima_vassouras.csv"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "text/csv; charset=utf-8"
