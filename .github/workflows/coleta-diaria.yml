name: Coleta diária e publicação

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em Brasília
  workflow_dispatch:
  # Mudanças no site ou um CSV enviado pelo PC também republicam o site.
  # (Pushes feitos pelo próprio workflow não disparam outra execução.)
  push:
    branches: [main]
    paths: ["site/**", "dados/**"]

concurrency:
  group: coleta-publicacao
  cancel-in-progress: false

# Actions fixadas por SHA (a versão fica no comentário), para um repositório público.
jobs:
  coletar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar e publicar o CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publicar-csv.sh

  publicar:
    needs: coletar
    # Publica depois de uma coleta bem-sucedida, ou direto num push.
    if: ${{ !cancelled() && (needs.coletar.result == 'success' || needs.coletar.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # ref: main pega o commit que a coleta acabou de enviar.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Copiar o CSV para o site
        run: cp dados/clima_vassouras.csv site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Nome por tentativa: "Re-run failed jobs" não encontra dois pacotes com o mesmo nome.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
