name: Testes

on:
  push:
    branches: [main]
    paths: ["coleta/**", "requirements*.txt", "pyproject.toml"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: pytest
